name: Release

# Pushing a tag such as v0.1.0 builds all platforms and creates a GitHub
# Release. The artifacts are UNSIGNED: the macOS app has an ad-hoc signature
# only, and the Windows exe has no Authenticode signature. See the README
# "Signing a Mac build" section for how to sign a build yourself.

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # The tag must match the version in Cargo.toml, so a release never ships
  # a binary that reports the wrong version.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build both architectures
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      # One bundle recipe for local builds, CI, and releases.
      - name: Bundle TapPrint.app
        run: |
          set -eu
          mkdir -p dist
          lipo -create -output dist/tapprint \
            target/aarch64-apple-darwin/release/tapprint \
            target/x86_64-apple-darwin/release/tapprint
          chmod 755 dist/tapprint
          TAPPRINT_BINARY=dist/tapprint scripts/macos-app.sh
          lipo -archs dist/TapPrint.app/Contents/MacOS/tapprint
          ditto -c -k --keepParent dist/TapPrint.app dist/TapPrint-macos-universal.zip
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/TapPrint-macos-universal.zip

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target\release\tapprint.exe,LICENSE,README.md -DestinationPath dist\TapPrint-windows-x86_64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/TapPrint-windows-x86_64.zip

  linux:
    needs: check
    # The oldest supported runner, so the binary runs on older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev \
            libudev-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist/tapprint-linux-x86_64
          cp target/release/tapprint LICENSE README.md dist/tapprint-linux-x86_64/
          tar -C dist -czf dist/TapPrint-linux-x86_64.tar.gz tapprint-linux-x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/TapPrint-linux-x86_64.tar.gz

  release:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          # A tag such as v0.2.0-rc.1 makes a pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
