name: Release

# Pushing a tag such as v0.1.0 builds all platforms and creates a GitHub
# Release. The macOS app is signed with a Developer ID and notarized when the
# MACOS_CERTIFICATE secret is set, else it has an ad-hoc signature only. The
# Windows exe has no Authenticode signature. See CONTRIBUTING.md, "Signing".

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # The tag must match the version in Cargo.toml, so a release never ships
  # a binary that reports the wrong version.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  # One app for Apple silicon and one for Intel. Each is about half the size
  # of a combined one, and a Mac downloads only the half it can run.
  macos:
    name: macos (${{ matrix.arch }})
    needs: check
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    env:
      # Whether a Developer ID certificate is set up. Without one the app is
      # signed ad-hoc and macOS asks each person to allow it once.
      CAN_SIGN: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      # The certificate goes into a keychain that exists only for this job.
      - name: Load the Developer ID certificate
        if: env.CAN_SIGN == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -eu
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1)
          if [ -z "$identity" ]; then
            echo "::error::the certificate in MACOS_CERTIFICATE is not a Developer ID Application certificate"
            exit 1
          fi
          echo "TAPPRINT_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Bundle and sign TapPrint.app
        run: |
          set -eu
          # One bundle recipe for local builds, CI, and releases.
          TAPPRINT_BINARY=target/${{ matrix.target }}/release/tapprint scripts/macos-app.sh
          # The app must hold exactly the architecture its name promises.
          test "$(lipo -archs dist/TapPrint.app/Contents/MacOS/tapprint)" = "${{ matrix.arch }}"
          codesign -dv dist/TapPrint.app 2>&1 | grep -E "Authority|Signature|TeamIdentifier" || true
      # Apple scans the app and records that it may run. The ticket is then
      # stapled into the app, so a Mac can check it without being online.
      - name: Notarize
        if: env.CAN_SIGN == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -eu
          ditto -c -k --keepParent dist/TapPrint.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --wait --timeout 30m | tee "$RUNNER_TEMP/notary.log"
          grep -q "status: Accepted" "$RUNNER_TEMP/notary.log"
          xcrun stapler staple dist/TapPrint.app
          spctl --assess --type execute --verbose dist/TapPrint.app
      - name: Zip
        run: ditto -c -k --keepParent dist/TapPrint.app dist/TapPrint-macos-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: dist/TapPrint-macos-${{ matrix.arch }}.zip

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target\release\tapprint.exe,LICENSE,README.md,THIRD_PARTY_NOTICES.md,licenses -DestinationPath dist\TapPrint-windows-x86_64.zip
          # The bare program, which a running TapPrint downloads to update itself.
          Copy-Item target\release\tapprint.exe dist\tapprint-windows-x86_64.exe
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/TapPrint-windows-x86_64.zip
            dist/tapprint-windows-x86_64.exe

  linux:
    needs: check
    # The oldest supported runner, so the binary runs on older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev \
            libudev-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist/pkg/tapprint-linux-x86_64
          cp -R target/release/tapprint LICENSE README.md THIRD_PARTY_NOTICES.md licenses dist/pkg/tapprint-linux-x86_64/
          tar -C dist/pkg -czf dist/TapPrint-linux-x86_64.tar.gz tapprint-linux-x86_64
          # The bare program, which a running TapPrint downloads to update itself.
          cp target/release/tapprint dist/tapprint-linux-x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dist/TapPrint-linux-x86_64.tar.gz
            dist/tapprint-linux-x86_64

  # The licence text of every dependency, as one page beside the downloads.
  notices:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: |
          mkdir -p dist
          cargo about generate --locked about.hbs -o dist/THIRD-PARTY-LICENSES.html
      - uses: actions/upload-artifact@v7
        with:
          name: notices
          path: dist/THIRD-PARTY-LICENSES.html

  release:
    needs: [macos, windows, linux, notices]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Whether the signing key is set up, without exposing it to every step.
      CAN_SIGN: ${{ secrets.MINISIGN_SECRET_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS
      # TapPrint only installs an update whose checksums carry this
      # signature. Without the secret the release still works: the app then
      # shows the download page instead of updating itself.
      - name: Sign the checksums
        if: env.CAN_SIGN == 'true'
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          # The version is signed too, so an old release cannot be passed
          # off as a newer one.
          minisign -S -s "$RUNNER_TEMP/minisign.key" -m artifacts/SHA256SUMS \
            -t "tapprint ${GITHUB_REF_NAME#v}"
          rm -f "$RUNNER_TEMP/minisign.key"
          # The key in the repository is the one built into the app. A
          # signature it rejects would leave every till unable to update.
          minisign -V -p release/update-key.pub -m artifacts/SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          # A tag such as v0.2.0-rc.1 makes a pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
