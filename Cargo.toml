[package]
name = "tapprint"
version = "0.1.0-rc.7"
edition = "2024"
# The oldest Rust that builds every dependency (set by gpui-ce).
rust-version = "1.95"
description = "Till-side helper that prints a receipt bitmap to a USB or network thermal printer."
license = "MIT"
repository = "https://github.com/kongpda/tapprint"
homepage = "https://github.com/kongpda/tapprint"
readme = "README.md"
keywords = ["thermal-printer", "escpos", "receipt", "pos", "tray"]
categories = ["hardware-support", "gui"]
publish = false

[dependencies]
getrandom = "0.4"
gpui-ce = "0.3"
gpui-tray = { version = "0.3", default-features = false, features = ["gpui-ce", "menu-state"] }
gpui_ce_elements = "0.3"
gpui_ce_platform = "0.3"
# The printing itself: image to dots, ESC/POS, USB and network sending.
tapprint-core = { path = "crates/tapprint-core", version = "0.1.0-rc.7" }
# Draws the preview of an opened file. gpui already builds it, so it adds no code.
image = { version = "0.25", default-features = false }
# Verifies the signature on an update before it is installed.
minisign-verify = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The checksum of a downloaded update.
sha2 = "0.11"
tiny_http = "0.12"
# Asks GitHub for the latest release and downloads it. rustls, so no OpenSSL.
ureq = { version = "3", default-features = false, features = ["rustls"] }

# Local HTTPS for Safari. tiny_http's own rustls is too old (known advisories),
# so TapPrint terminates TLS itself and forwards to the plain listener.
[target.'cfg(target_os = "macos")'.dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# The same two again, so the HTTPS relay's tests also run on Linux.
[target.'cfg(all(unix, not(target_os = "macos")))'.dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
# Tests build small PNGs to print.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

# The Windows program's icon and file details. Does nothing on other systems.
[build-dependencies]
winresource = "0.1"

[workspace]
members = ["crates/tapprint-core"]

[package.metadata.cargo-machete]
# `gpui-ce` is imported as `gpui`. `libusb1-sys` is listed only for `vendored`.
ignored = ["gpui-ce", "libusb1-sys"]
