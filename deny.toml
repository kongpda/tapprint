# Licence check: `cargo deny check licenses`. CI runs it on every push.
# Every licence here lets TapPrint stay MIT. See THIRD_PARTY_NOTICES.md.

[graph]
# Only the systems TapPrint ships for.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]


[bans]
multiple-versions = "allow"

[advisories]
# cargo audit covers advisories in CI.
version = 2

[sources]
unknown-registry = "deny"
unknown-git = "deny"
